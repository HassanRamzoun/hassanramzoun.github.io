<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramzoun Coding</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

  <style>
    :root {
      --primary: #0a192f;
      --accent: #00cfff;
      --card: #112240;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--primary);
      color: white;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    header {
      text-align: center;
      padding: 100px 20px 50px;
    }

    h1 { color: var(--accent); font-size: 50px; }

    .search-box {
      text-align: center;
      margin-bottom: 30px;
    }

    .search-box input {
      padding: 12px;
      width: 300px;
      border-radius: 20px;
      border: none;
    }

    .apps-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      padding: 20px;
    }

    .app-card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      transition: 0.3s;
    }

    .app-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0,207,255,0.3);
    }

    .app-header {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .app-icon {
      width: 70px;
      height: 70px;
      border-radius: 15px;
      object-fit: cover;
    }

    .screenshots {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 10px;
    }

    .screenshots img {
      width: 120px;
      border-radius: 10px;
    }

    .btn {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg,#00cfff,#00ffcc);
      font-weight: bold;
      cursor: pointer;
    }

    .details-page {
      display: none;
      padding: 40px;
    }

    .back-btn {
      margin-bottom: 20px;
      display: inline-block;
      cursor: pointer;
      color: var(--accent);
    }

  </style>
</head>

<body>

<div id="particles-js"></div>

<header id="mainHeader">
  <h1>Ramzoun Coding</h1>
  <p>Build. Innovate. Code.</p>
</header>

<div class="search-box" id="searchBox">
  <input type="text" placeholder="Search apps..." onkeyup="searchApps(this.value)" />
</div>

<section class="apps-container" id="apps">

  <div class="app-card" onclick="openPage('ocr')">
    <div class="app-header">
      <img class="app-icon" src="images/ocr.png" />
      <div>
        <h3>Smart OCR Reader</h3>
        <small>⭐ 4.6 • Productivity</small>
      </div>
    </div>
    <div class="screenshots">
      <img src="images/ocr1.png" />
      <img src="images/ocr2.png" />
    </div>
    <button class="btn">View Details</button>
  </div>

  <div class="app-card" onclick="openPage('islamic')">
    <div class="app-header">
      <img class="app-icon" src="images/islamic.png" />
      <div>
        <h3>Islamic Application</h3>
        <small>⭐ 4.8 • Islamic</small>
      </div>
    </div>
    <div class="screenshots">
      <img src="images/islamic1.png" />
      <img src="images/islamic2.png" />
    </div>
    <button class="btn">View Details</button>
  </div>

</section>

<!-- APP DETAILS -->
<div id="details" class="details-page">
  <span class="back-btn" onclick="goBack()">⬅ Back</span>
  <h2 id="appTitle"></h2>
  <p id="appDesc"></p>
  <a id="appLink" target="_blank">
    <button class="btn">Download on Google Play</button>
  </a>
</div>

<script>
function openPage(app) {
  document.getElementById('apps').style.display = 'none';
  document.getElementById('searchBox').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('details').style.display = 'block';

  if(app === 'ocr'){
    document.getElementById('appTitle').innerText = 'Smart OCR Reader';
    document.getElementById('appDesc').innerText = 'Scan and extract text instantly using powerful OCR technology. Fast, accurate and easy.';
    document.getElementById('appLink').href = 'https://play.google.com/store/apps/details?id=com.h1.smartocr';
  }

  if(app === 'islamic'){
    document.getElementById('appTitle').innerText = 'Islamic Application';
    document.getElementById('appDesc').innerText = 'All-in-one Islamic app including Quran, Azkar, prayer times and more.';
    document.getElementById('appLink').href = 'https://play.google.com/store/apps/details?id=com.ramzoun.islamicapplication';
  }
}

function goBack(){
  document.getElementById('apps').style.display = 'grid';
  document.getElementById('searchBox').style.display = 'block';
  document.getElementById('mainHeader').style.display = 'block';
  document.getElementById('details').style.display = 'none';
}

function searchApps(value) {
  let cards = document.querySelectorAll('.app-card');
  cards.forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(value.toLowerCase()) ? 'block' : 'none';
  });
}

particlesJS("particles-js", {
  particles: {
    number: { value: 70 },
    size: { value: 3 },
    move: { speed: 2 },
    line_linked: { enable: true },
    color: { value: "#00cfff" }
  }
});
</script>

</body>
</html>
